<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{方案标题}}</title>
<style>
  /* 家宴方案模板
     改外观只动 :root 里的色值和三级字号，不要逐条改选择器，也不要另写样式。
     字体全部用系统字体，不引外部字体和 CDN，断网、拷到手机上都能打开。 */

  :root {
    --paper:  #F9F1E0;
    --ink:    #241F17;
    --ink-2:  #6B6152;
    --band:   #EFE6D0;
    --accent: #2F4A3B;

    --serif: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif CJK SC", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
            "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, "PingFang SC", monospace;

    --section: 30px;
    --body: 17px;
    --pad: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: var(--body);
    line-height: 1.8;
    letter-spacing: .01em;
    font-variant-numeric: tabular-nums;
  }

  .page { max-width: 760px; margin: 0 auto; padding: 56px 24px 120px; }

  /* ---------- 菜单图：进页面第一眼 ---------- */
  .menu-figure img {
    display: block;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }


  /* ---------- 左侧目录 ---------- */
  .toc {
    display: none;
    position: fixed;
    top: 0;
    left: calc(50vw - 568px);
    width: 168px;
    max-height: 100vh;
    overflow-y: auto;
    padding: 56px 0 40px;
    font-size: 14px;
    line-height: 1.55;
  }
  @media (min-width: 1220px) {
    .toc { display: block; }
  }
  .toc-head { display: none; }
  .toc > a {
    display: block;
    padding: 6px 0;
    color: var(--ink-2);
    text-decoration: none;
  }
  .toc > a:hover { color: var(--ink); }
  .toc > a.active { color: var(--ink); font-weight: 600; }
  .toc .sub { margin: 2px 0 6px 14px; }
  .toc .sub a {
    display: block;
    padding: 4px 0;
    font-size: 13px;
    color: #948A7C;
    text-decoration: none;
  }
  .toc .sub a:hover { color: var(--ink-2); }
  .toc .sub a.active { color: var(--ink); }

  [id] { scroll-margin-top: 40px; }

  /* ---------- 手机上的目录入口 ---------- */
  .topbar { display: none; }
  .scrim { display: none; }

  /* 文字菜单：不能生图时替换掉上面的图片块 */
  .menu-list { list-style: none; }
  .menu-list li {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 92px 88px 152px;
    gap: 8px 20px;
    align-items: baseline;
    padding: 18px 0;
  }
  .menu-list .name { font-family: var(--serif); font-size: 20px; }
  .menu-list .name small {
    display: block;
    font-family: var(--sans);
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink-2);
    margin-top: 3px;
  }
  .menu-list .tool { font-size: 15.5px; color: var(--ink-2); }
  .menu-list .dur { font-size: 15.5px; text-align: right; }
  .menu-list .ahead { font-size: 14.5px; color: var(--ink-2); }

  /* ---------- 章节 ---------- */
  section { margin-top: 92px; }
  h2 {
    font-family: var(--serif);
    font-size: var(--section);
    font-weight: 400;
    letter-spacing: .02em;
    line-height: 1.3;
  }

  /* ---------- 采购 ---------- */
  .tally {
    display: flex;
    align-items: baseline;
    gap: 18px;
    margin-top: 24px;
    font-size: 15px;
    color: var(--ink-2);
  }
  .tally .n { font-size: 20px; color: var(--ink); }
  .reset {
    margin-left: auto;
    border: 0;
    background: none;
    font: inherit;
    font-size: 15px;
    color: var(--ink-2);
    text-decoration: underline;
    text-underline-offset: 4px;
    cursor: pointer;
  }
  .checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 0 56px; margin-top: 6px; }
  .checklist h3 {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 400;
    margin: 36px 0 8px;
  }
  .checklist ul { list-style: none; }
  .checklist label {
    display: flex;
    gap: 13px;
    padding: 11px 0;
    font-size: 16.5px;
    line-height: 1.55;
    cursor: pointer;
  }
  .checklist input {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: 20px;
    height: 20px;
    margin-top: 3px;
    border: 2px solid var(--ink);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
  }
  .checklist input:checked { background: var(--ink); }
  .checklist input:checked::after {
    content: "";
    position: absolute;
    left: 5.5px;
    top: 1px;
    width: 5px;
    height: 10px;
    border-right: 2px solid var(--paper);
    border-bottom: 2px solid var(--paper);
    transform: rotate(40deg);
  }

  /* ---------- 时间线：树形文本 ---------- */
  .tree {
    margin-top: 26px;
    padding: 24px 30px 26px;
    background: var(--band);
    font-size: 15.5px;
    line-height: 1.85;
  }
  .tree + .tree { margin-top: 14px; }
  .tree .root { font-family: var(--mono); font-size: 13.5px; color: var(--ink-2); }
  .tree ul { list-style: none; margin-top: 8px; padding-left: 2em; }
  .tree li { position: relative; padding: 3px 0; }
  .tree li::before {
    content: "├─";
    position: absolute;
    left: -1.7em;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-2);
  }
  .tree li:last-child::before { content: "└─"; }
  .serve { color: var(--accent); }

  /* ---------- 每道菜 ---------- */
  .dish { margin-top: 60px; }
  .dish h3 {
    display: flex;
    gap: 14px;
    align-items: baseline;
    font-family: var(--serif);
    font-size: 23px;
    font-weight: 400;
  }
  .dish .ing { margin-top: 14px; color: var(--ink-2); font-size: 16.5px; line-height: 1.8; }
  .dish ol { list-style: none; margin-top: 16px; counter-reset: step; }
  .dish li {
    position: relative;
    padding-left: 36px;
    font-size: 16.5px;
    line-height: 1.75;
    margin-top: 9px;
  }
  .dish li::before {
    counter-increment: step;
    content: counter(step) ".";
    position: absolute;
    left: 0;
    color: var(--ink-2);
  }

  /* ---------- 手机 ---------- */
  .nav-fab { display: none; }

  @media (max-width: 1219px) {
    .nav-fab {
      display: grid;
      place-items: center;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 26;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 0;
      border-radius: 9px;
      background: transparent;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: var(--ink);
      opacity: .34;
      cursor: pointer;
      transition: opacity .25s ease, background .25s ease;
    }
    .nav-fab:hover,
    .nav-fab:focus-visible { opacity: 1; }
    body.scrolled .nav-fab {
      opacity: 1;
      background: var(--paper);
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
    body.scrolled .nav-fab:hover,
    body.scrolled .nav-fab:focus-visible { opacity: 1; }
    body.nav-open .nav-fab { opacity: 0; pointer-events: none; }

    .toc {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 30;
      width: min(82vw, 320px);
      max-height: none;
      margin: 0;
      padding: 30px 26px 48px;
      border-radius: 0 20px 20px 0;
      background: rgba(249, 241, 224, .76);
      -webkit-backdrop-filter: blur(28px) saturate(1.6);
      backdrop-filter: blur(28px) saturate(1.6);
      overflow-y: auto;
      opacity: 0;
      transform: translateX(-103%);
      transition: transform .28s cubic-bezier(.22, .9, .24, 1), opacity .22s ease;
    }
    body.nav-open .toc { opacity: 1; transform: none; }

    .toc-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--ink-2);
    }
    .nav-close {
      border: 0;
      background: none;
      font: inherit;
      font-size: 13px;
      color: var(--ink-2);
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
    }
    .toc > a { font-size: 16px; padding: 10px 0; }
    .toc .sub { margin-left: 12px; }
    .toc .sub a { font-size: 14.5px; padding: 8px 0; }

    body.nav-open { overflow: hidden; }

    .scrim {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(30, 26, 20, .26);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s ease;
    }
    body.nav-open .scrim { opacity: 1; pointer-events: auto; }
  }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .toc { background: rgba(249, 241, 224, .97); }
  }

  @media (max-width: 620px) {
    :root { --section: 25px; --body: 16.5px; --pad: 22px; }
    .page { padding-top: 28px; padding-bottom: 80px; }
    section { margin-top: 64px; }
    .checklist { grid-template-columns: 1fr; }
    .menu-list li { grid-template-columns: minmax(0, 1fr) auto; gap: 3px 16px; padding: 16px 0; }
    .menu-list .name { grid-column: 1 / -1; }
    .menu-list .tool { grid-column: 1; grid-row: 2; font-size: 14.5px; }
    .menu-list .dur { grid-column: 2; grid-row: 2; font-size: 15px; }
    .menu-list .ahead { grid-column: 1 / -1; grid-row: 3; text-align: left; font-size: 14px; }
    .tree { padding: 18px 16px 20px; font-size: 15px; }
    .tree ul { padding-left: 1.6em; }
    .dish { margin-top: 44px; }
  }

  /* ---------- 打印 ---------- */
  @page { margin: 16mm 15mm; }
  @media print {
    :root { --body: 10.5pt; }
    body { background: #fff; }
    .toc, .nav-fab, .scrim { display: none; }
    .page { max-width: none; padding: 0; }
    h2 { font-size: 15pt; }
    section { margin-top: 22pt; }
    .menu-figure img { max-width: 60%; }
    .tree { background: none; padding: 0; font-size: 9pt; line-height: 1.7; }
    .serve { color: #000; text-decoration: underline; }
    .tally .reset { display: none; }
    .dish, .tree, .checklist .group { break-inside: avoid; }
    .dish { margin-top: 18pt; }
  }
</style>
</head>
<body>

<!--
  家宴方案模板
  用法：复制本文件 → 只替换正文内容 → 结构和类名不要改。

  写作规则：
    1. 页面第一块就是菜单图，不放标题、不放页首信息。
    2. 菜单图压缩后以 Base64 data URL 内嵌到 src，交付单文件 HTML；生不了图就用下面的 .menu-list 文字菜单。
    3. 采购只写食材名和用量，不加挑选提示、不加备注。
    4. 时间线写在 .tree 里：<p class="root"> 是分块标题，下面用嵌套 <ul>，
       层级靠缩进，竖线和折角由样式生成；出菜的行末尾加 <span class="serve">第 N 道</span>。
    5. 每道菜一个 .dish：不带序号的菜名、一行用料、按顺序编号的步骤。
    6. 不要加页脚、不要加装饰性小字、不要加第二种强调色。
    7. planId 每次换一个，避免和上一份方案的勾选状态串味。
-->

<div class="shell">

  <button class="nav-fab" type="button" aria-expanded="false" aria-controls="toc" aria-label="打开目录">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M2.5 4h11M2.5 8h11M2.5 12h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <nav class="toc" id="toc">
    <div class="toc-head">
      <span>目录</span>
      <button class="nav-close" type="button">关闭</button>
    </div>
    <a href="#menu">菜单</a>
    <a href="#shopping">采购</a>
    <a href="#timeline">时间线</a>
    <a href="#recipes">文字菜谱</a>
    <div class="sub">
      <a href="#dish-1">「菜名」</a>
      <a href="#dish-2">「菜名」</a>
    </div>
  </nav>

  <div class="scrim"></div>

  <div class="page">

  <figure class="menu-figure" id="menu">
    <img src="{{menu-image}}" alt="{{菜单图}}" draggable="false">
  </figure>

  <!-- 生不了图时：删掉上面整个 <figure>，改用这块，id 跟着挪过来。
  <ul class="menu-list" id="menu">
    <li>
      <span class="name">「菜名」<small>「凉菜 / 硬菜 / 快手 / 主食」</small></span>
      <span class="tool">「蒸锅」</span>
      <span class="dur">「25 分钟」</span>
      <span class="ahead">「当天做，T-40 上桌」</span>
    </li>
  </ul>
  -->

  <section id="shopping">
    <h2>采购</h2>

    <p class="tally">
      <span class="n"><span id="count">0</span> / <span id="total">0</span></span>
      <span>已备</span>
      <button class="reset" id="reset">重置</button>
    </p>

    <div class="checklist">
      <div class="group">
        <h3>「生鲜」</h3>
        <ul>
          <li><label><input type="checkbox"><span>「莴笋 1 根」</span></label></li>
        </ul>
      </div>
    </div>
  </section>

  <section id="timeline">
    <h2>时间线</h2>

    <div class="tree">
      <p class="root">[「前一天下午或晚间：甜品独立制作」]</p>
      <ul>
        <li>1. 「一行一步」</li>
        <li>2. 「一行一步」</li>
      </ul>
    </div>

    <div class="tree">
      <p class="root">[「当天 19:00 开席，从 T-90 开始备」]</p>
      <ul>
        <li>T-90~75　「洗、泡、沥干」
          <ul>
            <li>「一行一步」</li>
          </ul>
        </li>
        <li>T-25~0　「三个厨具同时开工」
          <ul>
            <li>T-25　「蒸锅上汽，蒸菜入锅」</li>
            <li>T-09　「出锅装盘」<span class="serve">第 1 道</span></li>
          </ul>
        </li>
      </ul>
    </div>
  </section>

  <section id="recipes">
    <h2>文字菜谱</h2>

    <article class="dish" id="dish-1">
      <h3>「菜名」</h3>
      <p class="ing">「用料与调味」</p>
      <ol>
        <li>「一步一件事」</li>
      </ol>
    </article>
  </section>

</div>

  </div>

<script>
(function () {
  var boxes = Array.prototype.slice.call(document.querySelectorAll('.group input'));
  var storageKey = 'cook.shopping.{{plan-id}}';
  var countEl = document.getElementById('count');
  var totalEl = document.getElementById('total');

  function render() {
    var done = boxes.filter(function (b) { return b.checked; }).length;
    countEl.textContent = done;
    totalEl.textContent = boxes.length;
  }
  function save() {
    var state = boxes.map(function (b) { return b.checked ? 1 : 0; }).join('');
    try { localStorage.setItem(storageKey, state); } catch (e) {}
  }
  function load() {
    var state = null;
    try { state = localStorage.getItem(storageKey); } catch (e) {}
    if (state && state.length === boxes.length) {
      boxes.forEach(function (b, i) { b.checked = state[i] === '1'; });
    }
  }

  boxes.forEach(function (b) {
    b.addEventListener('change', function () { render(); save(); });
  });
  document.getElementById('reset').addEventListener('click', function () {
    boxes.forEach(function (b) { b.checked = false; });
    render(); save();
  });

  load(); render();
})();

(function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a'));
  var targets = links.map(function (a) {
    return document.querySelector(a.getAttribute('href'));
  });
  if (!links.length) return;

  var ticking = false;
  function update() {
    ticking = false;
    var idx = 0;
    for (var i = 0; i < targets.length; i++) {
      var t = targets[i];
      if (t && t.getBoundingClientRect().top <= 140) idx = i;
    }
    links.forEach(function (a, i) { a.classList.toggle('active', i === idx); });
  }
  function onScroll() {
    if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
  }
  function markScrolled() {
    document.body.classList.toggle('scrolled', window.scrollY > 140);
  }
  window.addEventListener('scroll', function () { onScroll(); markScrolled(); }, { passive: true });
  window.addEventListener('resize', onScroll);
  markScrolled();
  var toggle = document.querySelector('.nav-fab');
  var scrim = document.querySelector('.scrim');

  function closeNav() {
    document.body.classList.remove('nav-open');
    if (toggle) toggle.setAttribute('aria-expanded', 'false');
  }

  links.forEach(function (a, i) {
    a.addEventListener('click', function () {
      links.forEach(function (b, j) { b.classList.toggle('active', i === j); });
      closeNav();
    });
  });

  if (toggle) {
    toggle.addEventListener('click', function () {
      var open = !document.body.classList.contains('nav-open');
      document.body.classList.toggle('nav-open', open);
      toggle.setAttribute('aria-expanded', String(open));
    });
  }
  if (scrim) scrim.addEventListener('click', closeNav);
  var closeBtn = document.querySelector('.nav-close');
  if (closeBtn) closeBtn.addEventListener('click', closeNav);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeNav();
  });

  update();
})();
</script>
</body>
</html>
